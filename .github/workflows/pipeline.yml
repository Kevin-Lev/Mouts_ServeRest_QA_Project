name: Cypress Tests

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'test/**'
      - 'ci/**'
  pull_request:
  schedule:
    - cron: '0 17 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node_Install
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies_Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier - Check Formatting
        run: npm run format:check

  cypress-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node_Install
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies_Install
        run: npm ci

      - name: Firefox - Run API Tests
        run: npx cypress run --browser firefox --spec "cypress/e2e/api/**/*.cy.js"

  cypress-frontend:
    runs-on: ubuntu-latest
    needs: cypress-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node_Install
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies_Install
        run: npm ci

      - name: Firefox - Run Frontend Tests
        run: npm run cy:run:frontend:video

      - name: Upload Screenshots and Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidencias
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7