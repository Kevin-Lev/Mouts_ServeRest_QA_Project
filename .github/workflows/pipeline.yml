name: Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cypress-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Code
        uses: actions/checkout@v4

      - name: Node_Install.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependencies_Install
        run: npm ci

      - name: Firefox - Run API Tests
        run: npx cypress run --browser firefox --spec "cypress/e2e/api/**/*.cy.js"

  cypress-frontend:
    runs-on: ubuntu-latest
    needs: cypress-api
    steps:
      - name: Checkout_Code
        uses: actions/checkout@v4

      - name: Node_Install.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependencies_Install
        run: npm ci

      - name: Firefox - Run Frontend Tests
        run: npx cypress run --browser firefox --spec "cypress/e2e/frontend/**/*.cy.js"